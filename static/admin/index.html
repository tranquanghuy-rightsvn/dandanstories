<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - DanDan Stories</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/assets/favicon.svg">
<!-- Admin panel embedded on the site domain. If it does not load within 12 seconds, an
     "Open in a new tab" button appears. Change the panel address in CMS_URL below. -->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #f5f6f8;
               font-family: "Open Sans", "Segoe UI", sans-serif; color: #1c1c1c; }
  /* Height of the notice bar at the top of the embedded frame (measured; change this one number if it moves). */
  :root { --gg-warning-height: 25px; }

  .cms-viewport { position: fixed; inset: 0; overflow: hidden; }
  .cms-frame {
    position: absolute;
    top: calc(var(--gg-warning-height) * -1);
    left: 0;
    width: 100%;
    height: calc(100% + var(--gg-warning-height));
    border: 0;
    display: block;
  }

  .cms-status {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: #f5f6f8;
  }
  .cms-status.hidden { display: none; }
  .cms-status h2 { font-size: 18px; margin: 0 0 8px; }
  .cms-status p { font-size: 14px; color: #666; margin: 6px 0; line-height: 1.6; }
  .cms-status a {
    display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 6px;
    background: #b4532a; color: #fff; text-decoration: none; font-weight: 600;
  }
  .spinner {
    width: 32px; height: 32px; margin: 0 auto 16px;
    border: 3px solid rgba(0,0,0,.1); border-top-color: #b4532a; border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="cms-status" id="cms-status">
  <div>
    <div class="spinner" id="cms-spinner"></div>
    <h2 id="cms-status-title">Opening the admin panel...</h2>
    <p id="cms-status-text">If it does not open within 12 seconds, use the button below.</p>
    <a id="cms-open-tab" href="#" rel="nofollow noreferrer" style="display:none">Open in a new tab</a>
  </div>
</div>

<div class="cms-viewport">
  <iframe class="cms-frame" id="cms-frame" title="Admin panel" referrerpolicy="no-referrer"></iframe>
</div>

<script>
  var CMS_URL = 'https://script.google.com/macros/s/AKfycbxyzZ9Cfnb0BC3MbsdpGvufPM5friJT4bPMQGgtiScO30iVE3gFoYdee9rsEx2uxwZlWQ/exec'; // admin panel URL (see README.md)

  var frame = document.getElementById('cms-frame');
  var statusBox = document.getElementById('cms-status');
  var loaded = false;

  // Fallback button opens the panel URL directly.
  document.getElementById('cms-open-tab').href = CMS_URL;

  // The iframe load event fires even for cross-origin content - enough to tell loaded from stuck.
  frame.addEventListener('load', function () {
    loaded = true;
    statusBox.classList.add('hidden');
    console.log('[admin] embedded');
  });

  // Stuck too long -> show the fallback instead of a blank screen.
  setTimeout(function () {
    if (loaded) return;
    console.warn('[admin] not loaded after 12s - showing direct link');
    document.getElementById('cms-spinner').style.display = 'none';
    document.getElementById('cms-status-title').textContent = 'The admin panel could not be embedded';
    document.getElementById('cms-status-text').textContent =
      'This browser blocked the embedded admin panel. Use the button below to open it directly.';
    document.getElementById('cms-open-tab').style.display = 'inline-block';
  }, 12000);

  frame.src = CMS_URL;
</script>
</body>
</html>
