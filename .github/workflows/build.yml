name: Build & deploy DanDan Stories

# CMS ghi NHIEU commit cho 1 thao tac (anh -> chi tiet bai -> index). CI chi chay o file CHOT
# (luon ghi sau cung - GAS.md muc VIII), KHONG chay theo anh trong static/images/** - neu
# khong se build o trang thai do dang va ton luot build vo ich.
# Thay doi do dev day len (giao dien, code build) cung trigger.
on:
  push:
    branches: [main, master]
    paths:
      - "data/posts.json"
      - "data/pages.json"
      - "data/categories.json"
      - "data/website.json"
      - "templates/**"
      - "scripts/build.py"
      - "static/**"
      - "!static/images/**"
      - "wrangler.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# Luu nhieu bai lien tiep -> chi can ban build moi nhat.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # html/ khong nam trong git - build lai tu dau moi lan (khong commit nguoc ve repo).
      - name: Build site tinh
        run: python3 scripts/build.py

      # Can 2 secret o Settings > Secrets and variables > Actions:
      #   CLOUDFLARE_API_TOKEN  (quyen Account > Workers Scripts > Edit)
      #   CLOUDFLARE_ACCOUNT_ID
      - name: Deploy len Cloudflare (Workers Static Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
