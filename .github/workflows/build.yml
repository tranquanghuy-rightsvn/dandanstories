name: Build HTML DanDan Stories

# Sinh html/ tu data/ + templates/ + static/ roi COMMIT NGUOC vao repo. KHONG deploy o day:
# Cloudflare (Workers Builds, ket noi thang repo) tu deploy khi thay html/ doi - khong can
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
#
# CMS ghi NHIEU commit cho 1 thao tac (anh -> chi tiet bai -> index). Chi chay o file CHOT
# (luon ghi sau cung - GAS.md muc VIII), KHONG chay theo anh trong static/images/**.
# Commit "CI: build html" do GITHUB_TOKEN tao ra KHONG kich hoat lai workflow (khong lap vo han).
on:
  push:
    branches: [main, master]
    paths:
      - "data/posts.json"
      - "data/pages.json"
      - "data/categories.json"
      - "data/website.json"
      - "templates/**"
      - "scripts/build.py"
      - "static/**"
      - "!static/images/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

# Luu nhieu bai lien tiep -> chi can ban build moi nhat.
concurrency:
  group: build-html
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site tinh -> html/
        run: python3 scripts/build.py

      # CMS co the vua commit them trong luc build -> pull --rebase roi push lai (CMS khong bao gio
      # ghi vao html/, CI chi ghi html/ -> rebase khong xung dot).
      - name: Commit html/ da build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A html/
          if git diff --cached --quiet; then
            echo "html/ khong doi - khong commit"
            exit 0
          fi
          git commit -m "CI: build html from data"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
