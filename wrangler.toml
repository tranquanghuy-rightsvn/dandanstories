# Cloudflare Worker (chi Static Assets, khong co Worker script) cho RapidFanPost.
# html/ do GitHub Actions build + commit vao repo; Cloudflare Workers Builds (ket noi thang repo)
# chi deploy thu muc do (KHONG can build command) - xem README.md muc 2.
# Ten Worker tren dashboard PHAI trung `name` duoi day, neu khong lan build se loi.
name = "dandanstories"
compatibility_date = "2026-10-01"

[assets]
directory = "./html"
# MOI URL noi dung co dang "/<slug>/" va file nam o "<slug>/index.html" -> can phan giai
# index thu muc. "auto-trailing-slash" (mac dinh): "/slug/" phuc vu slug/index.html,
# "/slug" tu redirect 307 ve "/slug/". KHONG dung "none" (se lam "/" va "/slug/" 404).
html_handling = "auto-trailing-slash"
# Site nhieu trang (khong phai SPA): URL la tra html/404.html kem HTTP 404 THAT.
not_found_handling = "404-page"
